version: '3.8'
services:
  back: &back
    container_name: aunshop_backend
    build: 
      context: ../../
      dockerfile: devops/Dockerfile
    restart: 
     unless-stopped
    volumes:
      - ../../:/opt/services/aunshop_backend/
    env_file:
      - ../../.env
    ports:
      - "8000:8000" 
    command: sh -c "python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic
      --no-input && python manage.py runserver 0.0.0.0:8000"
    networks:
      - main_network
      - nginx_network
      
  db:
    image: postgres:15-alpine
    container_name: aunshop_db
    restart: unless-stopped
    volumes:
      - ../../storage:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - main_network
    env_file:
      - ../../.env

networks:
  main_network:
    driver: bridge
  nginx_network:
    driver: bridge