version: '3.9'

services:
  nginx:
    container_name: aunshop_nginx
    image: nginx:1.25.2-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/conf.dev:/etc/nginx/conf.d
      - ../../staticfiles:/opt/services/aunshop_backend/back_static
      - ../../media:/opt/services/aunshop_backend/back_media
    networks:
      - nginx_network