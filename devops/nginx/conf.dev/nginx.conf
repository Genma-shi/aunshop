upstream aunshop_server {
    server aunshop_backend:8000;
}

server {
    listen 80;
    client_max_body_size 20M;

    location /admin/ {
        proxy_pass http://aunshop_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /opt/services/aunshop_backend/back_static/;
    }

    location /media/ {
        alias /opt/services/aunshop_backend/back_media/;
    }

    location /api/ {
        proxy_pass http://aunshop_server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
